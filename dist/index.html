<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignCraft 3D — Procedural Road Sign & Gantry Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@500;700;900&family=Overpass:wght@500;600;700;800&family=Public+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/motion.js">
    <link rel="modulepreload" crossorigin href="./assets/three.js">
    <link rel="modulepreload" crossorigin href="./assets/icons.js">
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-[#FAF7F2] text-[#1E2430] antialiased selection:bg-[#7C83FD]/20 selection:text-[#1E2430] overflow-hidden">
    <div id="root"></div>
    <script>
      (function () {
        var hasBuiltBundle = document.querySelector('script[src*="assets/app.js"]');
        if (!hasBuiltBundle && location.hostname.indexOf('github.io') !== -1) {
          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './dist/assets/index.css';
          document.head.appendChild(css);
          var js = document.createElement('script');
          js.type = 'module';
          js.src = './dist/assets/app.js';
          document.body.appendChild(js);
        }
      })();
    </script>
  </body>
